name: Sync fra realfag
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this site
        uses: actions/checkout@v4
        with:
          path: site
      - name: Checkout realfag
        uses: actions/checkout@v4
        with:
          repository: MatsAmundsen/realfag
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bygg og publiser
        run: |
          cd src
          cp build.js build.cjs
          cp scripts/prepare-dist.js scripts/prepare-dist.cjs
          node build.cjs
          node scripts/prepare-dist.cjs
          rsync -a --delete --exclude .git --exclude .github dist/ ../site/
          touch ../site/.nojekyll
          cd ../site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Ingen endringer"
          else
            git commit -m "Sync Matteguiden fra realfag"
            git pull --rebase origin main || true
            git push
          fi
